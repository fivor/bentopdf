name: Trivy Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan-image:
    runs-on: ubuntu-latest
    strategy:
      # One registry hiccup must not cancel the sibling image scan
      fail-fast: false
      matrix:
        image:
          - name: bentopdf
            file: Dockerfile
          - name: bentopdf-nonroot
            file: Dockerfile.nonroot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # public.ecr.aws and Docker Hub both rate-limit anonymous pulls by IP, and
      # GitHub Actions runners share one huge IP pool -> random 429s. Probe the
      # candidates and hand buildx a source that actually answers right now.
      - name: Resolve base image source
        id: base
        shell: bash
        env:
          IMAGE_FILE: ${{ matrix.image.file }}
        run: |
          set -uo pipefail
          resolve() {
            local name="$1"; shift
            local src
            for src in "$@"; do
              echo "::group::Probing ${src}"
              if docker pull --quiet "${src}" >/dev/null 2>&1; then
                echo "::endgroup::"
                echo "Resolved ${name} -> ${src}"
                echo "${name}=${src}" >> "$GITHUB_OUTPUT"
                return 0
              fi
              echo "::endgroup::"
              echo "::warning::${src} unavailable (rate limit or network)"
            done
            return 1
          }

          resolve node \
            "mirror.gcr.io/library/node:20-alpine" \
            "node:20-alpine" \
            "public.ecr.aws/docker/library/node:20-alpine" \
            || { echo "::error::No source could serve node:20-alpine"; exit 1; }

          if [ "${IMAGE_FILE}" = "Dockerfile.nonroot" ]; then
            resolve nginx \
              "mirror.gcr.io/library/nginx:alpine-slim" \
              "nginx:alpine-slim" \
              || { echo "::error::No source could serve nginx:alpine-slim"; exit 1; }
          fi

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          load: true
          tags: ${{ matrix.image.name }}:scan
          no-cache: true
          build-args: |
            NODE_IMAGE=${{ steps.base.outputs.node }}
            NGINX_IMAGE=${{ steps.base.outputs.nginx }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:scan
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      # Only upload when the scanner actually produced a report, otherwise a
      # failed build ends up as a bogus "Path does not exist" error.
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image.name)) != ''
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

  scan-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan npm dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload dependency scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-deps.sarif') != ''
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

  scan-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Dockerfiles for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH

      - name: Upload config scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
